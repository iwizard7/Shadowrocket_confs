Gaming-Group = url-test, policy-regex-filter=(Game|LowLatency|🎮|Steam), interval=600, timeout=5, url=http://www.gstatic.com/generate_204
AUTO = url-test, policy-regex-filter=^(?!.*(YouTube|Россия|🇷🇺)).*, interval=600, timeout=5, url=http://www.gstatic.com/generate_204

[Host]
